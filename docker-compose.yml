services:
  localstack:
    image: localstack/localstack:latest
    container_name: turbo-octo-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb,cloudcontrol
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null && awslocal dynamodb list-tables >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  processor:
    build:
      context: ./services/processor
      dockerfile: Dockerfile
    container_name: turbo-octo-processor
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      PROCESSOR_ID: processor-1
      QUEUE_URL: http://localstack:4566
      RAW_QUEUE_URL: http://localstack:4566/000000000000/raw-events
      PROCESSED_QUEUE_URL: http://localstack:4566/000000000000/processed-events
      REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      WORKER_COUNT: 5
      JOB_BUFFER_SIZE: 10
      SHUTDOWN_TIMEOUT: 30s
      SQS_MAX_NUMBER_OF_MESSAGES: 10
      SQS_WAIT_TIME_SECONDS: 20
      SQS_VISIBILITY_TIMEOUT_SECONDS: 30
      RECEIVE_BACKOFF_INITIAL: 1s
      RECEIVE_BACKOFF_MAX: 30s
      RECEIVE_BACKOFF_JITTER: 250ms
      PUBLISH_MAX_ATTEMPTS: 3
      PUBLISH_BACKOFF_INITIAL: 100ms
      PUBLISH_BACKOFF_MAX: 2s
      PUBLISH_BACKOFF_JITTER: 50ms

volumes:
  localstack-data:
