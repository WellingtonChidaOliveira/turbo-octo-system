services:
  localstack:
    image: localstack/localstack:latest
    container_name: turbo-octo-localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs,dynamodb,cloudcontrol
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack-data:/var/lib/localstack
      - ./infra/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null && awslocal dynamodb list-tables >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  localstack-data:
